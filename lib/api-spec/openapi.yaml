openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: arena
    description: Prompt practice operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /task:
    get:
      operationId: getTask
      tags: [arena]
      summary: Get the next practice task
      responses:
        "200":
          description: A practice task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
  /tasks:
    get:
      operationId: listTasks
      tags: [arena]
      summary: List all practice tasks
      responses:
        "200":
          description: Practice task library
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
  /evaluate:
    post:
      operationId: evaluatePrompt
      tags: [arena]
      summary: Evaluate a submitted prompt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvaluatePromptInput"
      responses:
        "200":
          description: Prompt feedback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Evaluation"
        "400":
          description: Invalid submission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /progress:
    get:
      operationId: getProgress
      tags: [arena]
      summary: Get current practice progress
      responses:
        "200":
          description: User progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Progress"
  /checkpoint:
    post:
      operationId: getCheckpoint
      tags: [arena]
      summary: Get a five-task checkpoint summary
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckpointInput"
      responses:
        "200":
          description: Checkpoint summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Checkpoint"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Task:
      type: object
      properties:
        id:
          type: string
        order:
          type: number
        title:
          type: string
        brief:
          type: string
        conceptFocus:
          type: string
          enum: [Role, Task, Context, Constraints, Output Format]
        category:
          type: string
        categoryColor:
          type: string
        tip:
          type: string
      required: [id, order, title, brief, conceptFocus, category, categoryColor, tip]
    EvaluatePromptInput:
      type: object
      properties:
        taskId:
          type: string
          minLength: 1
        userPrompt:
          type: string
          minLength: 10
          maxLength: 1500
      required: [taskId, userPrompt]
    Evaluation:
      type: object
      properties:
        score:
          type: number
          minimum: 1
          maximum: 10
        conceptFocus:
          type: string
          enum: [Role, Task, Context, Constraints, Output Format]
        flaws:
          type: array
          items:
            type: string
        improvedRewrite:
          type: string
        encouragement:
          type: string
      required: [score, conceptFocus, flaws, improvedRewrite, encouragement]
    Progress:
      type: object
      properties:
        completed:
          type: number
        total:
          type: number
        averageScore:
          type: number
        currentConcept:
          type: string
          enum: [Role, Task, Context, Constraints, Output Format]
        streak:
          type: number
        scores:
          type: array
          items:
            type: number
      required: [completed, total, averageScore, currentConcept, streak, scores]
    CheckpointInput:
      type: object
      properties:
        completed:
          type: number
    Checkpoint:
      type: object
      properties:
        completed:
          type: number
        averageScore:
          type: number
        conceptMastered:
          type: string
        recurringWeakness:
          type: string
        headline:
          type: string
        nextFocus:
          type: string
      required: [completed, averageScore, conceptMastered, recurringWeakness, headline, nextFocus]
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

